[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]
exclude = ["fuzz", "vendor/uesave"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
base64 = "0.23"
tracing = "0.1"
tempfile = "3.27"
flate2 = "1.1"
lz-str = "0.2"
lz4_flex = "0.14"
bzip2 = "0.6"
lzma-rs = "0.3"
zstd = { version = "0.14.3", default-features = false }
snap = "1.1"
brotli = "9"
uesave = "0.7"
aes = "0.9"
cbc = "0.2"
pbkdf2 = "0.13"
sha1 = "0.11"
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "std"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
quick-xml = "0.42"
toml_edit = "0.25"
saphyr = "0.2"
saphyr-parser = "0.2"
encoding_rs = "0.8"
blake3 = "1.8"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "serialize"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = "0.3"
proptest = "1.12"
insta = "1.49"
saveprism-core = { path = "crates/saveprism-core" }
saveprism-codecs = { path = "crates/saveprism-codecs" }

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/huseyincancalti/saveprism"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# uesave (third-party) may panic on malformed input. The gvas codec turns that panic into an error
# with catch_unwind, which needs unwinding; "abort" would turn it into a process crash.
panic = "unwind"
strip = true

# uesave 0.7.1 with two read fixes for garbage lengths (see vendor/uesave/PATCHES.md).
[patch.crates-io]
uesave = { path = "vendor/uesave" }
