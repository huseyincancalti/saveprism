[package]
name = "saveprism-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
saveprism-core = { path = "../crates/saveprism-core" }
saveprism-codecs = { path = "../crates/saveprism-codecs" }

