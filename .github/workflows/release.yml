name: release

# Builds SavePrism for Windows, Linux and macOS and uploads everything to a draft GitHub release
# tagged v<version> (version from apps/desktop/src-tauri/tauri.conf.json), with latest.json for the
# in-app updater. Run it by hand: Actions → release → Run workflow. The draft stays hidden until the
# maintainer publishes it; it must not be a pre-release, or releases/latest/download/latest.json
# (the updater endpoint) would not find it.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY: the text of the updater key file
# (%USERPROFILE%\.tauri\saveprism-updater.key on the maintainer's PC; it has no password).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # The oldest supported Ubuntu runner, so the AppImage runs on older glibc versions too.
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf build-essential

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: SavePrism __VERSION__
          releaseBody: The release notes are added before this draft is published.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
